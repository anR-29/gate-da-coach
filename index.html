<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GATE DA Coach</title>
  <meta name="description" content="Daily adaptive GATE DA practice: question sets, revision cards, theory, recall sheet and progress.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffefd6'/%3E%3Cpath d='M9 22V10h5a6 6 0 0 1 0 12z' fill='none' stroke='%23cc4e00' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <script>
    // Theme lives here (not in app.js) so it works even before the app modules load.
    (function () {
      var modes = ['auto', 'light', 'dark'];
      var mode = 'auto';
      try { mode = localStorage.getItem('gdc.theme') || 'auto'; } catch (e) {}
      function apply() {
        if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', mode);
        var btn = document.getElementById('themebtn');
        if (btn) {
          btn.title = 'Theme: ' + mode;
          btn.querySelector('use').setAttribute('href', mode === 'light' ? '#i-sun' : mode === 'dark' ? '#i-moon' : '#i-auto');
        }
      }
      apply();
      document.addEventListener('click', function (e) {
        if (!e.target.closest || !e.target.closest('#themebtn')) return;
        mode = modes[(modes.indexOf(mode) + 1) % modes.length];
        try { localStorage.setItem('gdc.theme', mode); } catch (err) {}
        apply();
      });
      document.addEventListener('DOMContentLoaded', apply);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="css/app.css?v=202611020540">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="js/app.js?v=202611020540"></script>
</head>

  <header>
    <div class="mobile-brand"><span class="workspace-mark"><svg class="icon"><use href="#i-target"/></svg></span> GATE DA</div>
    <div class="breadcrumbs"><svg class="icon"><use href="#i-book"/></svg><span>GATE DA 2027</span><svg class="icon sm"><use href="#i-chevron"/></svg><strong id="crumb">Today</strong></div>
    <div class="header-meta">
      <span class="exam-date" id="examdays"></span>
      <span class="timer" id="timer"></span>
      <button class="btn outline icon-only" id="themebtn" title="Theme: auto" aria-label="Switch theme"><svg class="icon"><use href="#i-auto"/></svg></button>
      <button class="btn outline" id="syncbtn" title="Sync now"><svg class="icon"><use href="#i-sync"/></svg><span id="sync">local</span></button>
    </div>
  </header>

  <div class="shell">
    <aside>
      <div class="workspace"><span class="workspace-mark"><svg class="icon"><use href="#i-target"/></svg></span>GATE DA Coach</div>
